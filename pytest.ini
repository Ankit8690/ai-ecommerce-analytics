[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short --disable-warnings
markers =
    db: requires PostgreSQL (ecommerce_readonly) connectivity
    api: requires FastAPI app importable + read-only DB
    llm: requires Gemini API key + quota (skipped by default)
    slow: takes >2 seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
